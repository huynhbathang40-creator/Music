[build]
  publish = "public"
  functions = "netlify/functions"

# Same-origin proxy to SunoAPI so the browser never hits CORS.
# The user's API key travels in the Authorization header and is passed through untouched.
[[redirects]]
  from = "/suno-api/*"
  to = "https://api.sunoapi.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/suno-upload/*"
  to = "https://sunoapiorg.redpandaai.co/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), geolocation=()"
